name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build (node-server preset for Playwright)
        run: npm run build:e2e
        env:
          NUXT_PUBLIC_FIREBASE_API_KEY: ${{ secrets.NUXT_PUBLIC_FIREBASE_API_KEY || 'ci-dummy-key' }}

      - name: Install Playwright browsers
        # Les dépendances système (polices surtout) viennent d'apt : quand les
        # miroirs Ubuntu du runner sont injoignables, l'installation échouait
        # avant le moindre test. L'image du runner a déjà de quoi lancer
        # Chromium : on retombe alors sur le navigateur seul.
        run: npx playwright install --with-deps chromium || npx playwright install chromium

      - name: Run E2E tests
        run: npx playwright test --reporter=line

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
